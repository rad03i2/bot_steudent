name: run-bot

# يشغّل البوت على سيرفرات GitHub مجاناً.
# كل جولة تعمل قرابة 5 ساعات و40 دقيقة (حد GitHub هو 6 ساعات)، وفي نهايتها
# تشغّل الجولة التالية بنفسها (workflow_dispatch)، فيبقى البوت شغالاً بشكل متواصل.
# الجدولة كل 30 دقيقة احتياطية فقط: GitHub لا يضمن توقيتها وقد يؤخرها ساعات.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CHAIN_NEXT_RUN: "true"
          WORKFLOW_FILE: bot.yml
          DATA_KEY: ${{ secrets.DATA_KEY || secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Baghdad' }}
          WEEK_START: ${{ vars.WEEK_START || 'sunday' }}
          MONTH_STYLE: ${{ vars.MONTH_STYLE || 'levantine' }}
          REMINDERS: ${{ vars.REMINDERS || 'true' }}
          MORNING_TIME: ${{ vars.MORNING_TIME || '07:00' }}
          EVENING_TIME: ${{ vars.EVENING_TIME || '20:00' }}
        # exec: حتى تصل إشارة الإيقاف من GitHub للسكربت نفسه فيحفظ البيانات قبل الخروج
        run: exec ./scripts/actions_run.sh
